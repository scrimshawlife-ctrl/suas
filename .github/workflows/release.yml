# Creates a GitHub Release when a vX.Y.Z tag is pushed. The notes are the
# matching section of CHANGELOG.md on the default branch. It does not build, deploy, or publish
# anything else. Tags are pushed by hand after an approved merge (RELEASING.md).
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read CHANGELOG.md from the default branch so a tag on an older commit
      # (for example the v0.1.0 baseline) still finds its section.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Create GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "${GITHUB_REPOSITORY#*/} $TAG" --notes-file notes.md

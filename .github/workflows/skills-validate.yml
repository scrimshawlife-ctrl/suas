name: Skills Validate

on:
  pull_request:
    paths:
      - 'SKILLS.md'
      - 'skills/**'
      - 'scripts/validate-skills.py'
      - '.github/workflows/skills-validate.yml'
  push:
    branches: [main]
    paths:
      - 'SKILLS.md'
      - 'skills/**'
      - 'scripts/validate-skills.py'
      - '.github/workflows/skills-validate.yml'

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SUAS runtime skills
        run: python scripts/validate-skills.py

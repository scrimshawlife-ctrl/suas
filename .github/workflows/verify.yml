# Repository quality checks.
#
# SUAS-specs HANDOFF.md §5 ("CI workflow(s) once toolchain exists");
# SUAS-specs ENVIRONMENT.md §5 (configuration validation runs in tests);
# SUAS-specs ENVIRONMENT.md §8 (builds intended for shared testing carry provenance);
# SUAS-specs TESTING.md §2 (unit, integration, and migration layers).
#
# TEST is a synthetic-only environment class: no real veteran data and no real
# external side effects (ENVIRONMENT.md §2).

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # staging-deploy.yml reuses these exact checks for the SHA it is about to deploy.
  workflow_call:
    inputs:
      ref:
        # Each job checks this before checkout, so a caller verifies exactly one commit.
        description: Full 40-character commit SHA to verify
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  # Only a newer push to the same PR cancels an older run. Every main SHA and every reusable
  # call finishes, so a deployed SHA always has a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suas
          POSTGRES_PASSWORD: suas
          POSTGRES_DB: suas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Explicit environment class; never inferred (ENVIRONMENT.md §2).
      SUAS_ENV: TEST
      SUAS_SPEC_VERSION: '0.10.0'
      SUAS_RELEASE_MANIFEST: RELEASE_MANIFEST-0.10.0.md
      SUAS_ALLOW_REAL_EXTERNAL_EFFECTS: 'false'
      SUAS_MIGRATIONS_MODE: apply
      SUAS_BROWSER_AUTH_MODE: disabled
      SUAS_EMAIL_MODE: fake
      SUAS_SMS_MODE: fake
      SUAS_TRANSPORTATION_ADAPTER_MODE: fake
      SUAS_SHELTER_ADAPTER_MODE: fake
      SUAS_FOOD_ADAPTER_MODE: fake
      SUAS_PEER_SUPPORT_ADAPTER_MODE: manual
      SUAS_SUPPORT_SIGNAL_MODE: fixture
      SUAS_SAFETY_COPY_MODE: placeholder_test_only
      SUAS_SENSITIVE_AGGREGATE_REPORTING: disabled
      DATABASE_URL: postgresql://suas:suas@localhost:5432/suas_test
      TEST_DATABASE_URL: postgresql://suas:suas@localhost:5432/suas_test
      # Migration-harness tests rebuild a schema from empty, so they own a
      # database separate from the one the other suites share.
      TEST_MIGRATIONS_DATABASE_URL: postgresql://suas:suas@localhost:5432/suas_migrations_test

    steps:
      - name: Require a full commit SHA for inputs.ref
        env:
          REF: ${{ inputs.ref }}
          # A called workflow sees its caller's workflow_ref, so only verify.yml's own runs may omit ref.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ || ( -z "$REF" && "$WORKFLOW_REF" == */.github/workflows/verify.yml@* ) ]] || { echo "::error::inputs.ref must be a full 40-character lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            infra/package-lock.json

      - name: Create the migration-test database
        env:
          PGPASSWORD: suas
        run: psql -h localhost -U suas -d suas_test -c 'CREATE DATABASE suas_migrations_test'

      - name: Install dependencies
        run: npm ci

      - name: Generate a throwaway session secret
        # Authentication is an enabled capability, so SUAS_SESSION_SECRET is
        # required (ENVIRONMENT.md §5). Generated per run and never committed
        # (ENVIRONMENT.md §6-§7).
        run: echo "SUAS_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Provide dotenv file for runtime CLI wrappers
        # The npm migration and provenance scripts intentionally load .env for
        # local parity. Existing CI environment variables take precedence over
        # the safe placeholder values in this temporary, untracked file.
        run: cp .env.example .env

      - name: Stamp build provenance
        # ENVIRONMENT.md §8: commit SHA and build timestamp for shared builds.
        run: |
          echo "SUAS_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SUAS_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: OpenAPI route drift
        # Fails when registered /api/v0 routes and docs/openapi/v0.json disagree.
        run: npm run openapi:check

      - name: Web app checks
        # web/ is a separate package (not an npm workspace): lint, typecheck, unit tests,
        # and the production build of the React app. The generated API types must match
        # docs/openapi/v0.json, so a contract change without `npm run gen:api` fails here.
        working-directory: web
        run: |
          npm ci
          npm run gen:api && git diff --exit-code src/api/schema.d.ts
          npm run check

      - name: Infrastructure checks
        # infra/ is a separate package (not an npm workspace): typecheck, CDK assertion tests
        # and an offline `cdk synth`. It bundles the Lambda code from this repository's src/
        # with esbuild, so it runs after the root `npm ci` and needs no Docker and no AWS
        # credentials. It never deploys (the AWS account layout is undecided, plan §8 item 17).
        working-directory: infra
        run: |
          npm ci
          npm run check

      - name: Eval (gates CI)
        # F11: scores the synthetic intake set with the scripted fake adapter, so the
        # numbers check the harness, not a model. This step gates CI.
        # An unspecified Linux `run` shell is `bash -e {0}` (workflow syntax,
        # jobs.<job_id>.steps[*].shell). That does not set pipefail, so
        # `false | tee` exits 0. `shell: bash` is the documented command
        # `bash --noprofile --norc -eo pipefail {0}`, which fails the step when
        # `npm run eval` fails.
        shell: bash
        env:
          SUAS_MODEL_INFERENCE_MODE: fake
        run: npm run eval | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Migration harness against a fresh database
        run: npm run migrate -- apply

      - name: Migration rehearsal on the migration-test database
        # Re-plans against the separate migration database and fails on drift or orphans.
        run: npm run migrate:rehearse

      - name: Build provenance surface
        run: npm run provenance

  web-e2e-shard:
    # The web app's Playwright suite (web/e2e) against the LOCAL fake stack that
    # web/e2e/stack.ts builds: a throwaway suas_local_* database on this runner,
    # fake and sink adapters, no real external effects (ENVIRONMENT.md §2).
    runs-on: ubuntu-24.04
    # Four isolated runners keep one worker per disposable database. Preserve the 80-minute
    # Playwright budget and 90-minute job backstop; no tests or assertions are omitted.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suas
          POSTGRES_PASSWORD: suas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The stack drops and recreates its database through this server
      # (assertDisposableDatabase: localhost only, suas_local_<name> only).
      SUAS_E2E_DB_HOST_URL: postgresql://suas:suas@localhost:5432
      # AGENTS.md: CI keeps the placeholder safety copy.
      SUAS_E2E_SAFETY_COPY_MODE: placeholder_test_only

    steps:
      - name: Require a full commit SHA for inputs.ref
        env:
          REF: ${{ inputs.ref }}
          # A called workflow sees its caller's workflow_ref, so only verify.yml's own runs may omit ref.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ || ( -z "$REF" && "$WORKFLOW_REF" == */.github/workflows/verify.yml@* ) ]] || { echo "::error::inputs.ref must be a full 40-character lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        # The stack runs the API, migrator and seed from the root package.
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Web end-to-end tests
        working-directory: web
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Partial UI coverage report for this shard
        # Each /api/v0 operation against its web callers and the e2e page hits that
        # web/e2e/contract.ts logged. Report only until the gate turns on `--check`.
        if: ${{ !cancelled() }}
        run: npm run --silent ui:coverage >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the UI coverage log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-ui-coverage-${{ matrix.shard }}
          path: web/e2e-results/coverage/
          retention-days: 7

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results-${{ matrix.shard }}
          path: web/e2e-results/
          retention-days: 7

  web-e2e:
    # Preserve the existing required check name and fail closed on any failed/cancelled shard.
    if: ${{ always() }}
    needs: web-e2e-shard
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.web-e2e-shard.result }}
        run: test "$SHARD_RESULT" = success

  skills:
    # The skill metadata checks from skills-validate.yml, on every PR and every reusable call
    # rather than only when skill paths change. Run through uv, as AGENTS.md asks for Python checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require a full commit SHA for inputs.ref
        env:
          REF: ${{ inputs.ref }}
          # A called workflow sees its caller's workflow_ref, so only verify.yml's own runs may omit ref.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ || ( -z "$REF" && "$WORKFLOW_REF" == */.github/workflows/verify.yml@* ) ]] || { echo "::error::inputs.ref must be a full 40-character lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check skill metadata
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 python -m unittest discover -s tests -p 'test_skill_metadata.py' -v
      - name: Validate SUAS runtime skills
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.3 python scripts/validate-skills.py

# Not run here, by design:
# - test:e2e:staging needs a deployed STAGING origin; staging-deploy.yml runs its @public set.
# - soak:staging takes hours against STAGING; va:sandbox-smoke calls a real provider.
# - settle:check consumes a finished CI run; smoke:demo is LOCAL-only; load:synthetic only
#   prints timings.

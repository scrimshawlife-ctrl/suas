# Repository quality checks.
#
# SUAS-specs HANDOFF.md §5 ("CI workflow(s) once toolchain exists");
# SUAS-specs ENVIRONMENT.md §5 (configuration validation runs in tests);
# SUAS-specs ENVIRONMENT.md §8 (builds intended for shared testing carry provenance);
# SUAS-specs TESTING.md §2 (unit, integration, and migration layers).
#
# TEST is a synthetic-only environment class: no real veteran data and no real
# external side effects (ENVIRONMENT.md §2).

name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suas
          POSTGRES_PASSWORD: suas
          POSTGRES_DB: suas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Explicit environment class; never inferred (ENVIRONMENT.md §2).
      SUAS_ENV: TEST
      SUAS_SPEC_VERSION: '0.7.0'
      SUAS_RELEASE_MANIFEST: RELEASE_MANIFEST-0.7.0.md
      SUAS_ALLOW_REAL_EXTERNAL_EFFECTS: 'false'
      SUAS_MIGRATIONS_MODE: apply
      SUAS_BROWSER_AUTH_MODE: disabled
      SUAS_EMAIL_MODE: fake
      SUAS_SMS_MODE: fake
      SUAS_TRANSPORTATION_ADAPTER_MODE: fake
      SUAS_SHELTER_ADAPTER_MODE: fake
      SUAS_FOOD_ADAPTER_MODE: fake
      SUAS_PEER_SUPPORT_ADAPTER_MODE: manual
      SUAS_SUPPORT_SIGNAL_MODE: fixture
      SUAS_SAFETY_COPY_MODE: placeholder_test_only
      SUAS_SENSITIVE_AGGREGATE_REPORTING: disabled
      DATABASE_URL: postgresql://suas:suas@localhost:5432/suas_test
      TEST_DATABASE_URL: postgresql://suas:suas@localhost:5432/suas_test
      # Migration-harness tests rebuild a schema from empty, so they own a
      # database separate from the one the other suites share.
      TEST_MIGRATIONS_DATABASE_URL: postgresql://suas:suas@localhost:5432/suas_migrations_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            infra/package-lock.json

      - name: Create the migration-test database
        env:
          PGPASSWORD: suas
        run: psql -h localhost -U suas -d suas_test -c 'CREATE DATABASE suas_migrations_test'

      - name: Install dependencies
        run: npm ci

      - name: Generate a throwaway session secret
        # Authentication is an enabled capability, so SUAS_SESSION_SECRET is
        # required (ENVIRONMENT.md §5). Generated per run and never committed
        # (ENVIRONMENT.md §6-§7).
        run: echo "SUAS_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Provide dotenv file for runtime CLI wrappers
        # The npm migration and provenance scripts intentionally load .env for
        # local parity. Existing CI environment variables take precedence over
        # the safe placeholder values in this temporary, untracked file.
        run: cp .env.example .env

      - name: Stamp build provenance
        # ENVIRONMENT.md §8: commit SHA and build timestamp for shared builds.
        run: |
          echo "SUAS_BUILD_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SUAS_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Synthetic STAGING contract
        # Static guard only. It does not contact Cloudflare or deploy anything.
        run: npm run staging:contract

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: OpenAPI route drift
        # Fails when registered /api/v0 routes and docs/openapi/v0.json disagree.
        run: npm run openapi:check

      - name: Web app checks
        # web/ is a separate package (not an npm workspace): lint, typecheck, unit tests,
        # and the production build of the React app.
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Infrastructure checks
        # infra/ is a separate package (not an npm workspace): typecheck, CDK assertion tests
        # and an offline `cdk synth`. It bundles the Lambda code from this repository's src/
        # with esbuild, so it runs after the root `npm ci` and needs no Docker and no AWS
        # credentials. It never deploys (the AWS account layout is undecided, plan §8 item 17).
        working-directory: infra
        run: |
          npm ci
          npm run check

      - name: Eval (reporting only)
        # F11: scores the synthetic intake set with the scripted fake adapter, so the
        # numbers check the harness, not a model. This step gates the workflow.
        # An unspecified Linux `run` shell is `bash -e {0}` (workflow syntax,
        # jobs.<job_id>.steps[*].shell). That does not set pipefail, so
        # `false | tee` exits 0. `shell: bash` is the documented command
        # `bash --noprofile --norc -eo pipefail {0}`, which fails the step when
        # `npm run eval` fails.
        shell: bash
        env:
          SUAS_MODEL_INFERENCE_MODE: fake
        run: npm run eval | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Migration harness against a fresh database
        run: npm run migrate -- apply

      - name: Build provenance surface
        run: npm run provenance

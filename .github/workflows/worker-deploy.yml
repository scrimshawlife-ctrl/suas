# Manual publish of the Fastify Worker. Does not run on push.
# Requires GitHub Environment `suas-synthetic-staging` with:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RESEND_API_KEY,
#            STAGING_DATABASE_URL, SUAS_SESSION_SECRET, SUAS_STAGING_AUTH_EMAILS
#   variables: SUAS_HYPERDRIVE_ID, SUAS_EMAIL_FROM
# The Hyperdrive ID is supplied by the dedicated synthetic Environment so CI cannot fall back to wrangler.jsonc.
# Does not authorize PRODUCTION or formal STAGING class (see D-001/D-005 packet).

name: worker-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to publish the synthetic Worker'
        required: true
        type: string

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: suas-synthetic-staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUAS_HYPERDRIVE_ID: ${{ vars.SUAS_HYPERDRIVE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUAS_EMAIL_FROM: ${{ vars.SUAS_EMAIL_FROM }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SUAS_SESSION_SECRET: ${{ secrets.SUAS_SESSION_SECRET }}
          SUAS_STAGING_AUTH_EMAILS: ${{ secrets.SUAS_STAGING_AUTH_EMAILS }}
        run: |
          test -n "$SUAS_HYPERDRIVE_ID"
          test -n "$RESEND_API_KEY"
          test -n "$SUAS_EMAIL_FROM"
          test -n "$STAGING_DATABASE_URL"
          test -n "$SUAS_SESSION_SECRET"
          test -n "$SUAS_STAGING_AUTH_EMAILS"
          sed "s/YOUR_HYPERDRIVE_ID/$SUAS_HYPERDRIVE_ID/; s/\"name\": \"suas\"/\"name\": \"suas-synthetic-staging\"/" \
            wrangler.jsonc > .wrangler.suas-synthetic-ci.jsonc
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY \
            --config .wrangler.suas-synthetic-ci.jsonc
          printf '%s' "$SUAS_SESSION_SECRET" | npx wrangler secret put SUAS_SESSION_SECRET \
            --config .wrangler.suas-synthetic-ci.jsonc
          SUAS_ENV=STAGING \
          SUAS_SPEC_VERSION=0.6.0 \
          SUAS_RELEASE_MANIFEST=RELEASE_MANIFEST-0.6.0.md \
          SUAS_ALLOW_REAL_EXTERNAL_EFFECTS=false \
          SUAS_MIGRATIONS_MODE=validate \
          DATABASE_URL="$STAGING_DATABASE_URL" \
          DATABASE_POOL_MAX=1 \
          SUAS_BROWSER_AUTH_MODE=email_otp \
          SUAS_BROWSER_TENANT_ID=00000000-0000-4000-8000-000000000001 \
          SUAS_EMAIL_MODE=sink \
          SUAS_SMS_MODE=sink \
          SUAS_TRANSPORTATION_ADAPTER_MODE=fake \
          SUAS_SHELTER_ADAPTER_MODE=fake \
          SUAS_FOOD_ADAPTER_MODE=fake \
          SUAS_PEER_SUPPORT_ADAPTER_MODE=manual \
          SUAS_SUPPORT_SIGNAL_MODE=fixture \
          SUAS_SAFETY_COPY_MODE=placeholder_test_only \
          SUAS_SENSITIVE_AGGREGATE_REPORTING=disabled \
          npm run auth:staging:provision
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx wrangler deploy \
            --config .wrangler.suas-synthetic-ci.jsonc \
            --var "SUAS_EMAIL_FROM:${SUAS_EMAIL_FROM}" \
            --var "SUAS_E2E_BASE_URL:https://suas-synthetic-staging.suas.workers.dev" \
            --var "D007_DELETION_EXECUTION:disabled" \
            --var "D007_EXPORT_DELIVERY:disabled" \
            --var "D007_365_DAY_PURGE:disabled" \
            --var "D025_REPORTING:disabled" \
            --var "REAL_WORLD_EFFECTS:disabled" \
            --var "PILOT_LAUNCH:blocked" \
            --var "PRODUCTION_LAUNCH:blocked" \
            --var "SUAS_BUILD_COMMIT:${GITHUB_SHA}" \
            --var "SUAS_BUILD_TIMESTAMP:${STAMP}"

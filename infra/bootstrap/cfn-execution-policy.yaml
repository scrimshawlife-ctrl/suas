# Provision separately before the application. The execution role cannot modify the boundary.
AWSTemplateFormatVersion: '2010-09-09'
Description: Synthetic STAGING execution policies and runtime boundary; deploy requires separate approval.
Parameters:
  StagingApiHostname:
    Type: String
    AllowedPattern: '[a-z0-9]+([.-][a-z0-9]+)*\.[a-z]{2,}'
    Description: Exact API hostname in the reviewed staging assembly (no wildcard).
  StagingWebHostname:
    Type: String
    AllowedPattern: '[a-z0-9]+([.-][a-z0-9]+)*\.[a-z]{2,}'
    Description: Exact web hostname in the reviewed staging assembly (no wildcard).
  # R14.x region-restricted layout (suas #360) and R17 Bedrock: contributor proposals, not
  # released. The defaults keep the four-stack us-west-2 policies unchanged.
  StagingRegion:
    Type: String
    Default: us-west-2
    AllowedValues: [us-west-2, us-east-2]
    Description: Region of the Dns, Backend and Web stacks; us-east-1 stays allowed for edge services.
  ModelInference:
    Type: String
    Default: disabled
    AllowedValues: [disabled, bedrock]
    Description: bedrock adds the Guardrail deploy grants and the relay's model and guardrail boundary.
Conditions:
  BedrockInference:
    Fn::Equals:
      - Ref: ModelInference
      - bedrock
Resources:
  SuasCdkExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SuasCdkExecution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RegionalNetwork
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:ReplaceRoute
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:CreateVpcEndpoint
              - ec2:ModifyVpcEndpoint
              - ec2:DeleteVpcEndpoints
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: RegionalDescribe
            Effect: Allow
            Action:
              - ec2:Describe*
              - rds:Describe*
              - acm:ListCertificates
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Database
            Effect: Allow
            Action:
              - rds:CreateDBInstance
              - rds:ModifyDBInstance
              - rds:DeleteDBInstance
              - rds:CreateDBParameterGroup
              - rds:ModifyDBParameterGroup
              - rds:DeleteDBParameterGroup
              - rds:CreateDBSubnetGroup
              - rds:ModifyDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
              - rds:ListTagsForResource
              - rds:CreateDBSnapshot
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:rds:*:${AWS::AccountId}:db:suas-staging
              - Fn::Sub: arn:${AWS::Partition}:rds:*:${AWS::AccountId}:pg:suas-staging-*
              - Fn::Sub: arn:${AWS::Partition}:rds:*:${AWS::AccountId}:subgrp:suas-staging-*
              - Fn::Sub: arn:${AWS::Partition}:rds:*:${AWS::AccountId}:snapshot:suas-staging-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Lambda
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction*
              - lambda:UpdateFunction*
              - lambda:PublishVersion
              - lambda:ListVersionsByFunction
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:GetFunctionConcurrency
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
              - lambda:InvokeFunction
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Layer
            Effect: Allow
            Action:
              - lambda:GetLayerVersion
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:*:753240598075:layer:LambdaAdapterLayerArm64:*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:PutMetricFilter
              - logs:DeleteMetricFilter
              - logs:DescribeMetricFilters
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:Suas-*
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: LogInventory
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: BoundedRoleWrites
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Suas-*
            Condition:
              ArnEquals:
                iam:PermissionsBoundary:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SuasStagingRuntimeBoundary
          - Sid: GeneratedRolePolicies
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:UpdateRole
              - iam:TagRole
              - iam:UntagRole
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:DetachRolePolicy
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Suas-*
          - Sid: BasicLogging
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Suas-*
            Condition:
              ArnEquals:
                iam:PermissionsBoundary:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SuasStagingRuntimeBoundary
                iam:PolicyARN:
                  Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          - Sid: PassGeneratedRoles
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Suas-*
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - rds.amazonaws.com
                  - scheduler.amazonaws.com
                  - apigateway.amazonaws.com
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - rds.amazonaws.com
                  - ops.apigateway.amazonaws.com
                  - lambda.amazonaws.com
          - Sid: CannotRemoveBoundary
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Suas-*
          - Sid: CannotReplaceBoundary
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:PutRolePermissionsBoundary
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Suas-*
            Condition:
              ArnNotEquals:
                iam:PermissionsBoundary:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SuasStagingRuntimeBoundary
          - Sid: CannotEditBoundary
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SuasStagingRuntimeBoundary
  SuasCdkServicesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SuasCdkServices
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Alarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Notifications
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:TagResource
              - sns:UntagResource
              - sns:ListTagsForResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:sns:*:${AWS::AccountId}:Suas-Staging-Alarms
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: SubscriptionLifecycle
            Effect: Allow
            Action:
              - sns:GetSubscriptionAttributes
              - sns:SetSubscriptionAttributes
              - sns:Unsubscribe
            Resource:
              Fn::Sub: arn:${AWS::Partition}:sns:*:${AWS::AccountId}:Suas-Staging-Alarms
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: GeneratedSecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:UpdateSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
              - secretsmanager:GetResourcePolicy
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:Suas-Staging-Backend-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: RandomPasswords
            Effect: Allow
            Action:
              - secretsmanager:GetRandomPassword
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Parameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/suas/staging/*
              - Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/cdk/exports/Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Scheduler
            Effect: Allow
            Action:
              - scheduler:CreateSchedule
              - scheduler:UpdateSchedule
              - scheduler:DeleteSchedule
              - scheduler:GetSchedule
            Resource:
              Fn::Sub: arn:${AWS::Partition}:scheduler:*:${AWS::AccountId}:schedule/default/Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Buckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucket*
              - s3:PutBucket*
              - s3:DeleteBucketPolicy
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::suas-staging-*
              - Fn::Sub: arn:${AWS::Partition}:s3:::suas-staging-*/*
            Condition:
              StringEquals:
                s3:ResourceAccount:
                  Ref: AWS::AccountId
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          # Handler actions from the AWS::Bedrock::Guardrail and GuardrailVersion registry schemas,
          # without KMS (no customer key). CreateGuardrail has no guardrail resource type.
          - Fn::If:
              - BedrockInference
              - Sid: GuardrailCreate
                Effect: Allow
                Action: bedrock:CreateGuardrail
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: StagingRegion
              - Ref: AWS::NoValue
          - Fn::If:
              - BedrockInference
              - Sid: Guardrails
                Effect: Allow
                Action:
                  - bedrock:CreateGuardrailVersion
                  - bedrock:GetGuardrail
                  - bedrock:UpdateGuardrail
                  - bedrock:DeleteGuardrail
                  - bedrock:TagResource
                  - bedrock:UntagResource
                  - bedrock:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:${StagingRegion}:${AWS::AccountId}:guardrail/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: StagingRegion
              - Ref: AWS::NoValue
          - Sid: RdsEncryption
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:CreateGrant
            Resource:
              Fn::Sub: arn:${AWS::Partition}:kms:${StagingRegion}:${AWS::AccountId}:key/*
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: rds.${StagingRegion}.amazonaws.com
                kms:CallerAccount:
                  Ref: AWS::AccountId
  SuasCdkEdgePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SuasCdkEdge
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Creation has no stable ARN; restrict the complete requested domain set instead.
          - Sid: RequestStagingCertificates
            Effect: Allow
            Action: acm:RequestCertificate
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
                acm:ValidationMethod: DNS
              ForAllValues:StringEquals:
                acm:DomainNames:
                  - Ref: StagingApiHostname
                  - Ref: StagingWebHostname
              'Null':
                acm:DomainNames: 'false'
                acm:CertificateAuthority: 'true'
          - Sid: Certificates
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:DeleteCertificate
              - acm:AddTagsToCertificate
              - acm:RemoveTagsFromCertificate
              - acm:ListTagsForCertificate
            Resource:
              Fn::Sub: arn:${AWS::Partition}:acm:*:${AWS::AccountId}:certificate/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: HttpApi
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PATCH
              - apigateway:PUT
              - apigateway:DELETE
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:apigateway:*::/apis*
              - Fn::Sub: arn:${AWS::Partition}:apigateway:*::/domainnames*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: Dns
            Effect: Allow
            Action:
              - route53:CreateHostedZone
              - route53:GetHostedZone
              - route53:DeleteHostedZone
              - route53:ChangeResourceRecordSets
              - route53:ListResourceRecordSets
              - route53:ChangeTagsForResource
              - route53:ListTagsForResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::hostedzone/*
          - Sid: DnsChanges
            Effect: Allow
            Action:
              - route53:GetChange
            Resource:
              Fn::Sub: arn:${AWS::Partition}:route53:::change/*
          - Sid: Edge
            Effect: Allow
            Action:
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
              - cloudfront:CreateCachePolicy
              - cloudfront:GetCachePolicy
              - cloudfront:GetCachePolicyConfig
              - cloudfront:UpdateCachePolicy
              - cloudfront:DeleteCachePolicy
              - cloudfront:CreateOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:cache-policy/*
              - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
          # These creation actions do not support resource-level authorization.
          - Sid: EdgeCreate
            Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:CreateCachePolicy
              - cloudfront:CreateOriginAccessControl
            Resource: '*'
          - Sid: DnsCreate
            Effect: Allow
            Action:
              - route53:CreateHostedZone
            Resource: '*'
  SuasStagingRuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SuasStagingRuntimeBoundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:Suas-*
              - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: VpcEni
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: RuntimeSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:Suas-Staging-Backend-EmailRelay*
              - Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:suas/staging/*
            Condition:
              StringEquals:
                aws:ResourceAccount:
                  Ref: AWS::AccountId
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: RuntimeObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucket
              - s3:AbortMultipartUpload
              - s3:ListBucketMultipartUploads
              - s3:ListMultipartUploadParts
              - s3:GetObjectVersion
              - s3:DeleteObjectVersion
              - s3:ListBucketVersions
              - s3:PutObjectTagging
              - s3:GetObjectTagging
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::suas-staging-*
              - Fn::Sub: arn:${AWS::Partition}:s3:::suas-staging-*/*
            Condition:
              StringEquals:
                s3:ResourceAccount:
                  Ref: AWS::AccountId
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: PublishedAssets
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:GetBucketVersioning
              - s3:GetObjectVersion
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::cdk-hnb659fds-assets-${AWS::AccountId}-*
              - Fn::Sub: arn:${AWS::Partition}:s3:::cdk-hnb659fds-assets-${AWS::AccountId}-*/*
            Condition:
              StringEquals:
                s3:ResourceAccount:
                  Ref: AWS::AccountId
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: InvokeStaging
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:Suas-Staging-Backend-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: InvalidateWeb
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
          - Sid: CrossRegionExports
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:GetParameter
              - ssm:DeleteParameter
              - ssm:GetParameters
              - ssm:DeleteParameters
              - ssm:ListTagsForResource
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/cdk/exports/Suas-*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          - Sid: RestrictDefaultSecurityGroup
            Effect: Allow
            Action:
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  - Ref: StagingRegion
                  - us-east-1
          # R17 Bedrock (contributor proposal, not released): the relay calls Haiku 4.5 through the
          # us. profile only. Bedrock also authorizes the model in each destination Region.
          - Fn::If:
              - BedrockInference
              - Sid: InvokeModelProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:${StagingRegion}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: StagingRegion
              - Ref: AWS::NoValue
          - Fn::If:
              - BedrockInference
              - Sid: InvokeModelViaProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn:
                      Fn::Sub: arn:${AWS::Partition}:bedrock:${StagingRegion}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                    aws:RequestedRegion:
                      - us-east-1
                      - us-east-2
                      - us-west-2
              - Ref: AWS::NoValue
          - Fn::If:
              - BedrockInference
              - Sid: ApplyGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:${StagingRegion}:${AWS::AccountId}:guardrail/*
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Ref: StagingRegion
              - Ref: AWS::NoValue
Outputs:
  PolicyArn:
    Value:
      Ref: SuasCdkExecutionPolicy
  ServicesPolicyArn:
    Value:
      Ref: SuasCdkServicesPolicy
  EdgePolicyArn:
    Value:
      Ref: SuasCdkEdgePolicy
  RuntimeBoundaryArn:
    Value:
      Ref: SuasStagingRuntimeBoundary

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0C">
<title>Channel preferences — SUAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --bg: #0b0d0c;
  --bone: #e8e4d6;
  --bone-soft: #c9c3b2;
  --bone-dim: #9a9588;
  --olive: #9aaa5c;
  --olive-deep: #7a8644;
  --line: rgba(232, 228, 214, 0.3);
  --line-strong: rgba(232, 228, 214, 0.5);
  --plate: rgba(232, 228, 214, 0.03);
  --focus: #e8e4d6;
  --font-sans: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --font-serif: 'IBM Plex Serif', 'Georgia', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { color-scheme: dark; }

body {
  margin: 0;
  /* Relative units so text zoom and reflow (1.4.10, 1.4.4) work. */
  font: 1rem/1.5 var(--font-sans);
  color: var(--bone);
  background: var(--bg);
  isolation: isolate;
}

/* Decorative topo only. pointer-events: none so it cannot steal hits. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.18;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201440%20900%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%234a5348%22%20stroke-width%3D%220.7%22%3E%3Cpath%20d%3D%22M-40%20140C80%2090%20170%20190%20290%20140s210-90%20330-30%20220%20140%20360%2070%20250-90%20390-20%20220%2080%20310%2040%22%2F%3E%3Cpath%20d%3D%22M-20%20220C90%20180%20190%20280%20310%20230s200-70%20320-10%20210%20120%20350%2060%20240-70%20370%2010%20200%2070%20290%2030%22%2F%3E%3Cpath%20d%3D%22M-50%20310C70%20270%20180%20360%20300%20310s190-60%20310%2010%20200%20110%20340%2050%20230-60%20360%2020%20210%2080%20300%2035%22%2F%3E%3Cpath%20d%3D%22M-30%20400C100%20360%20210%20450%20330%20400s180-50%20300%2020%20190%20100%20330%2045%20220-50%20350%2025%20200%2070%20290%2040%22%2F%3E%3Cellipse%20cx%3D%221080%22%20cy%3D%22280%22%20rx%3D%22160%22%20ry%3D%2290%22%2F%3E%3Cellipse%20cx%3D%22240%22%20cy%3D%22620%22%20rx%3D%22130%22%20ry%3D%2270%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-size: 90rem 56rem;
}

/* 1.4.12 text spacing: never clip on user-adjusted spacing. */
p, li, dd { overflow-wrap: break-word; }

.shell {
  position: relative;
  max-width: 34rem;
  margin: 0 auto;
  /* Room for the fixed bottom nav so it never covers the last action.
     Safe-area inset keeps primary actions clear of a notched home indicator. */
  padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom, 0px));
}

.site-chrome {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 0 0 1.75rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  color: var(--bone);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.brand-name {
  font-size: 1rem;
}

.zero-mark {
  display: block;
  flex: none;
  color: var(--bone);
}

.status-pill {
  margin: 0;
  padding: 0.35rem 0.7rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  color: var(--bone);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

h1 {
  margin: 0 0 0.65rem;
  font-family: var(--font-serif);
  font-size: clamp(2rem, 8vw, 3.1rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.03em;
}

h2 {
  font-size: 1.05rem;
  font-weight: 500;
  line-height: 1.3;
  margin: 1.5rem 0 0.5rem;
}

h3 { font-size: 1rem; margin: 1rem 0 0.25rem; }

.kicker {
  margin: 1.25rem 0 0.35rem;
  color: var(--bone-dim);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.1em;
}

.loop {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0;
  row-gap: 0.45rem;
  margin: 1.25rem 0 0.25rem;
  padding: 0;
  list-style: none;
  color: var(--bone-dim);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.07em;
}

.loop li {
  position: relative;
  display: flex;
  flex: none;
  align-items: flex-start;
  padding-top: 0.85rem;
}

.loop li::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 6px;
  border: 1px solid var(--bone);
  border-radius: 50%;
  background: transparent;
}

.loop li:not(:last-child) {
  padding-right: 0.85rem;
  margin-right: 0.1rem;
}

.loop li:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 6px;
  width: calc(100% - 6px);
  height: 1px;
  background: var(--bone);
}

/* 2.4.7 / 2.4.11 focus is always visible and never clipped. Bone on #0b0d0c. */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.action, .action-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  padding: 0.75rem 1rem;
  margin: 0.5rem 0;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  background: transparent;
  color: var(--bone);
}

.action {
  border: 1px solid var(--line-strong);
}

.action-secondary {
  border: 1px solid var(--line);
}

.action:hover, .action-secondary:hover {
  background: rgba(232, 228, 214, 0.06);
}

button.action,
button.action-secondary {
  appearance: none;
  font: inherit;
}

form {
  margin: 0;
}

label {
  display: block;
  margin: 0.85rem 0 0.35rem;
  font-weight: 600;
}

input[type='text'],
input[type='email'],
input[type='tel'] {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 0.7rem 0.85rem;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  font: inherit;
  color: var(--bone);
  background: var(--plate);
}

fieldset.check-in-options {
  margin: 0.75rem 0;
  padding: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--plate);
}

fieldset.check-in-options legend {
  padding: 0 0.35rem;
  font-weight: 600;
}

label.option {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-height: 48px;
  margin: 0.35rem 0;
  font-weight: 500;
  cursor: pointer;
}

input[type='radio'] {
  width: 1.25rem;
  height: 1.25rem;
  accent-color: var(--olive);
}

/* 2.5.8 target size floor for every remaining interactive element. */
a, button, input, [role="button"] {
  min-height: 24px;
}

.card-grid {
  display: grid;
  /* Mobile-first: one column so 320 CSS px never grows a second 9rem track
     (1.4.10). Two columns only when 9rem + gap + 9rem fits the shell. */
  grid-template-columns: 1fr;
  gap: 0.75rem;
  padding: 0;
  margin: 0;
  list-style: none;
}

@media (min-width: 22.5rem) {
  .card-grid {
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  }
}

.card {
  display: block;
  min-height: 5rem;
  padding: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--plate);
  color: var(--bone);
  text-decoration: none;
}

.card-unavailable { color: var(--bone-soft); }

/*
 * 1.4.1 use of color: every state carries a text label. The badge adds
 * emphasis, it does not carry the meaning on its own.
 */
.badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border: 1px solid var(--olive);
  border-radius: 1rem;
  color: var(--olive);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.04em;
}

.state {
  padding: 0.75rem;
  border: 1px solid var(--line);
  border-left: 3px solid var(--olive);
  border-radius: 3px;
  background: var(--plate);
}

.reserved-slot {
  padding: 0.75rem;
  border: 1px dashed var(--line-strong);
  border-radius: 3px;
  background: var(--plate);
  color: var(--bone-dim);
}

.mobile-nav {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 10;
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.mobile-nav a {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0.5rem;
  color: var(--bone);
  font-weight: 600;
  text-decoration: none;
}

.mobile-nav a[aria-current='page'] {
  text-decoration: underline;
  box-shadow: inset 0 -3px 0 var(--olive);
}

dl {
  margin: 0.5rem 0;
}

dt {
  font-weight: 600;
  margin-top: 0.75rem;
}

dd {
  margin: 0.15rem 0 0;
}

.muted { color: var(--bone-dim); }

.skip-link {
  position: absolute;
  left: 0.75rem;
  top: 0.75rem;
  z-index: 30;
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0.75rem 1rem;
  background: var(--bone);
  color: var(--bg);
  font-weight: 600;
  text-decoration: none;
  /* 2.4.1: hidden until keyboard focus. clip-path (not left:-9999px) so
     the control stays in-tab-order and :focus-visible can reveal it. */
  clip-path: inset(50%);
  clip: rect(0 0 0 0);
  overflow: hidden;
  white-space: nowrap;
}

.skip-link:focus,
.skip-link:focus-visible {
  clip: auto;
  clip-path: none;
  overflow: visible;
}

/* 2.3.3 animation from interactions. Nothing here animates, and this keeps it so. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}</style>
</head>
<body><a href="#main" class="skip-link">Skip to main content</a><div class="shell"><header class="site-chrome"><span class="brand"><svg class="zero-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="8.25" fill="none" stroke="currentColor" stroke-width="1.35"></circle><line x1="3.5" y1="16" x2="28.5" y2="16" stroke="currentColor" stroke-width="1.35"></line></svg><span class="brand-name">zer0state</span></span><p class="status-pill">SPEC-017 · NOT READY</p></header><main id="main"><h1>Channel preferences</h1><a class="action-secondary" href="/app/notifications">Back to notifications</a><p class="muted">These settings only choose delivery channels. They do not grant consent and cannot authorize a send.</p><ul class="card-grid"><li class="card"><h2>EMAIL</h2><p><span class="badge">Enabled</span></p><form method="post" action="/app/notifications/preferences"><input type="hidden" name="channel" value="EMAIL"><input type="hidden" name="enabled" value="false"><button class="action" type="submit">Disable EMAIL</button></form></li><li class="card"><h2>SMS</h2><p><span class="badge">Enabled</span></p><form method="post" action="/app/notifications/preferences"><input type="hidden" name="channel" value="SMS"><input type="hidden" name="enabled" value="false"><button class="action" type="submit">Disable SMS</button></form></li><li class="card"><h2>IN_APP</h2><p><span class="badge">Enabled</span></p><form method="post" action="/app/notifications/preferences"><input type="hidden" name="channel" value="IN_APP"><input type="hidden" name="enabled" value="false"><button class="action" type="submit">Disable IN_APP</button></form></li></ul></main></div><nav class="mobile-nav" aria-label="Primary"><a href="/app/home">Home</a><a href="/app/chat">Chat</a></nav></body>
</html>
